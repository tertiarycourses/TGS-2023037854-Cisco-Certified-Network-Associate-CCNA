! CCNA Activity 06 | v7.0 | apply each block ONLY to its named device
! Device: S1
enable
configure terminal
hostname S1
no ip domain-lookup
interface range FastEthernet0/1,FastEthernet0/24
 switchport mode access
 no shutdown
exit
end
copy running-config startup-config

! Device: S2
enable
configure terminal
hostname S2
no ip domain-lookup
interface range FastEthernet0/1,FastEthernet0/24
 switchport mode access
 no shutdown
exit
end
copy running-config startup-config

! Device: R1
enable
configure terminal
hostname R1
no ip domain-lookup
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 10.0.0.1 255.255.255.252
 no shutdown
exit
ip route 10.10.20.0 255.255.255.0 10.0.0.2
ipv6 unicast-routing
interface GigabitEthernet0/0
 ipv6 address 2001:db8:10::1/64
exit
interface GigabitEthernet0/1
 ipv6 address 2001:db8:0::1/64
 ipv6 address fe80::1 link-local
exit
ipv6 route 2001:db8:20::/64 GigabitEthernet0/1 fe80::2
end
copy running-config startup-config

! Device: R2
enable
configure terminal
hostname R2
no ip domain-lookup
interface GigabitEthernet0/0
 ip address 10.10.20.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 10.0.0.2 255.255.255.252
 no shutdown
exit
ip route 10.10.10.0 255.255.255.0 10.0.0.1
ipv6 unicast-routing
interface GigabitEthernet0/0
 ipv6 address 2001:db8:20::1/64
exit
interface GigabitEthernet0/1
 ipv6 address 2001:db8:0::2/64
 ipv6 address fe80::2 link-local
exit
ipv6 route 2001:db8:10::/64 GigabitEthernet0/1 fe80::1
end
copy running-config startup-config
