! CCNA Activity 11 | v7.0 | apply each block ONLY to its named device
! Device: S1
enable
configure terminal
hostname S1
no ip domain-lookup
interface range FastEthernet0/1,FastEthernet0/24
 switchport mode access
 no shutdown
exit
end
copy running-config startup-config

! Device: R1
enable
configure terminal
hostname R1
no ip domain-lookup
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 no shutdown
exit

interface GigabitEthernet0/0
 description Users
exit
end
copy running-config startup-config
