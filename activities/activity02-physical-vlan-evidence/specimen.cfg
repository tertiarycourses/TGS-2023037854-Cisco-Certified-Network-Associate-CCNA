! CCNA Activity 02 | v7.0 | apply each block ONLY to its named device
! Device: R1
enable
configure terminal
hostname R1
no ip domain-lookup
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 no shutdown
exit
end
copy running-config startup-config

! Device: S1
enable
configure terminal
hostname S1
no ip domain-lookup
vlan 10
 name USERS
vlan 20
 name WRONG
interface range FastEthernet0/1-2,FastEthernet0/24
 switchport mode access
 switchport access vlan 10
 speed auto
 duplex auto
 no shutdown
exit
end
copy running-config startup-config
